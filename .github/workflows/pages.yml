name: Deploy site

# Publishes scribegraph/web to GitHub Pages. Turn Pages on once:
# Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "scribegraph/web/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Generate article"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that GitHub Pages is turned on
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is off::Settings > Pages > Source: GitHub Actions, then run this workflow again."
          fi

      - uses: actions/checkout@v7
        if: steps.pages.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Point the site at Cloudflare R2 (only if R2_PUBLIC_URL is set)
        if: steps.pages.outputs.enabled == 'true' && vars.R2_PUBLIC_URL != ''
        env:
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          printf 'window.CONFIG = { R2_PUBLIC_URL: "%s" };\n' "${R2_PUBLIC_URL%/}" > scribegraph/web/js/config.js

      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: scribegraph/web

      - name: Deploy
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5
