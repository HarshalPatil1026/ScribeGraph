[project]
name = "scribegraph"
version = "1.0.0"
description = "Autonomous multi-agent AI tech blog: LangGraph agents plan, write, review and publish Markdown articles to a static website."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harshal Patil" }]
keywords = ["langgraph", "langchain", "groq", "llm", "multi-agent", "ai-agents", "blog", "content-automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "boto3>=1.42",
    "langchain>=1.0",
    "langchain-core>=1.2",
    "langchain-groq>=1.1",
    "langgraph>=1.0",
    "pydantic-settings>=2.13",
    "python-dotenv>=1.2",
    "requests>=2.32",
    "sentry-sdk>=2.0",
]

[project.optional-dependencies]
# Prompt library and tracing (pulls in ~60 packages, so it is opt-in).
opik = ["opik>=1.8"]

[project.scripts]
scribegraph = "scribegraph.run:main"

[project.urls]
Repository = "https://github.com/HarshalPatil1026/ScribeGraph"
Changelog = "https://github.com/HarshalPatil1026/ScribeGraph/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scribegraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:langchain_core.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
